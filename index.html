<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Sâm Thượng Hạng</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f9f6f0; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #8B0000; margin-bottom: 20px; }
        
        /* Thanh tìm kiếm */
        .search-box { display: flex; margin-bottom: 20px; gap: 10px; }
        .search-box input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        .search-box button { padding: 10px 15px; background: #8B0000; color: white; border: none; border-radius: 6px; cursor: pointer; }
        
        /* Chi tiết sản phẩm */
        .product-card { display: none; text-align: center; }
        .product-card.active { display: block; }
        .product-img { width: 100%; max-height: 350px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .product-title { font-size: 24px; color: #8B0000; margin: 10px 0; }
        .product-price { font-size: 20px; color: #d9534f; font-weight: bold; margin-bottom: 10px; }
        .product-desc { text-align: left; line-height: 1.6; color: #555; background: #fdfbf7; padding: 15px; border-left: 4px solid #8B0000; border-radius: 4px; }
        
        /* Nút Đặt hàng & Chuyển trang */
        .btn-order { display: inline-block; width: 100%; background: #28a745; color: white; text-align: center; padding: 12px; border-radius: 6px; font-size: 18px; font-weight: bold; text-decoration: none; margin-top: 15px; cursor: pointer; }
        .btn-order:hover { background: #218838; }
        .pagination { display: flex; justify-content: space-between; margin-top: 20px; align-items: center; }
        .pagination button { padding: 8px 16px; background: #8B0000; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .pagination button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* Khu vực QR Code */
        .qr-section { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #28a745; background: #f4fbf7; text-align: center; border-radius: 8px; }
        .qr-img { width: 220px; height: 220px; margin-top: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h1> Tạ Thị Yến Nhi-2516030096</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Nhập tên món sâm cần tìm...">
        <button onclick="searchProduct()">Tìm</button>
    </div>

    <div id="productContainer"></div>

    <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)">Trước</button>
        <span id="pageInfo">Trang 1 / 3</span>
        <button id="nextBtn" onclick="changePage(1)">Sau</button>
    </div>

    <div id="qrSection" class="qr-section">
        <h3 style="color: #28a745; margin: 0 0 5px 0;">🎉 Đã ghi nhận click đặt hàng!</h3>
        <p style="margin: 0 0 10px 0; font-size: 14px;">Vui lòng quét mã QR dưới đây để hoàn tất thanh toán:</p>
        <img class="qr-img" src="https://via.placeholder.com/250x250.png?text=Anh+QR+Cua+Ban" alt="Mã QR Thanh Toán">
        <p style="font-size: 12px; color: #666; margin-top: 5px;">Nội dung chuyển khoản: [Họ tên] + [Tên món sâm]</p>
    </div>
</div>

<script>
    // CẤU HÌNH THÔNG TIN GOOGLE FORM TẠI ĐÂY
    const GOOGLE_FORM_BASE_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfXXXXXXXXXXXXX/viewform"; // Thay bằng link Form của bạn
    const FORM_ENTRY_ID = "entry.123456789"; // Thay bằng ID trường Tên món sâm của bạn

    // Dữ liệu 3 món ăn từ Sâm (Có thể copy thêm nếu muốn)
    const products = [
        {
            id: 1,
            title: "Gà Hầm Sâm Thượng Hạng",
            price: "450.000đ",
            image: "https://bizweb.dktcdn.net/100/489/006/files/ga-ham-sasa8.jpg?v=1698999407578?W=600", // Ảnh minh họa có sẵn
            desc: "Món ăn kết hợp giữa gà ác bổ dưỡng và nhân sâm tươi 6 năm tuổi. Giúp bồi bổ khí huyết, tăng cường sinh lực, thích hợp cho người mới ốm dậy và người già cần phục hồi sức khỏe nhanh chóng."
        },
        {
            id: 2,
            title: "Canh Sườn Heo Nấu Sâm Củ Tươi",
            price: "380.000đ",
            image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVI2-eSUlnLRCFrOcHxobosSbB_d87YhWyfXvUbV6a4Q&s=10?w=600",
            desc: "Sườn non chọn lọc hầm mềm cùng củ sâm tươi, táo đỏ và kỷ tử. Nước canh ngọt thanh, đậm đà vị thảo mộc thiên nhiên, hỗ trợ giải nhiệt, mát gan và làm đẹp da cho phụ nữ."
        },
        {
            id: 3,
            title: "Cháo Yến Mạch Nhân Sâm Mật Ong",
            price: "220.000đ",
            image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCD-xuMXQzeLunUKWQ9fWshRmr5WLdFXF5fZpBN4Rh4g&s=10?w=600",
            desc: "Sự kết hợp hoàn hảo giữa yến mạch nguyên cám, nhân sâm xay nhuyễn và mật ong rừng nguyên chất. Món ăn sáng nhẹ nhàng nhưng tràn đầy năng lượng, giúp tỉnh táo tinh thần và tốt cho hệ tiêu hóa."
        }
    ];

    let currentPage = 0; 
    let filteredProducts = [...products]; // Mảng bổ trợ phục vụ chức năng tìm kiếm

    // Hàm hiển thị sản phẩm dựa trên trang hiện tại
    function renderProduct() {
        const container = document.getElementById("productContainer");
        const qrSection = document.getElementById("qrSection");
        
        // Ẩn khu vực QR mỗi khi chuyển trang
        qrSection.style.display = "none";

        if (filteredProducts.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:red; margin: 40px 0;">Không tìm thấy món ăn nào phù hợp!</p>`;
            document.getElementById("pageInfo").innerText = "Trang 0 / 0";
            document.getElementById("prevBtn").disabled = true;
            document.getElementById("nextBtn").disabled = true;
            return;
        }

        const item = filteredProducts[currentPage];
        
        // Tạo link pre-filled nhảy thẳng vào Google Form điền sẵn tên món
        const orderLink = `${GOOGLE_FORM_BASE_URL}?usp=pp_url&${FORM_ENTRY_ID}=${encodeURIComponent(item.title)}`;

        container.innerHTML = `
            <div class="product-card active">
                <img class="product-img" src="${item.image}" alt="${item.title}">
                <div class="product-title">${item.title}</div>
                <div class="product-price">Giá: ${item.price}</div>
                <div class="product-desc">
                    <strong>Thông tin chi tiết:</strong><br>${item.desc}
                </div>
                <a href="${orderLink}" target="_blank" class="btn-order" onclick="showQR()">MỞ FORM ĐẶT HÀNG & THANH TOÁN</a>
            </div>
        `;

        // Cập nhật trạng thái nút bấm phân trang
        document.getElementById("pageInfo").innerText = `Trang ${currentPage + 1} / ${filteredProducts.length}`;
        document.getElementById("prevBtn").disabled = currentPage === 0;
        document.getElementById("nextBtn").disabled = currentPage === filteredProducts.length - 1;
    }

    // Hàm chuyển trang (Trước / Sau)
    function changePage(direction) {
        currentPage += direction;
        renderProduct();
    }

    // Chức năng tìm kiếm sản phẩm
    function searchProduct() {
        const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
        filteredProducts = products.filter(p => p.title.toLowerCase().includes(keyword));
        currentPage = 0; // Reset về trang đầu tiên của kết quả tìm kiếm
        renderProduct();
    }

    // Lắng nghe phím Enter trong ô tìm kiếm
    document.getElementById("searchInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") { searchProduct(); }
    });

    // Hàm hiển thị khung QR Code sau khi người dùng click Đặt hàng
    function showQR() {
        document.getElementById("qrSection").style.display = "block";
        // Tự động cuộn xuống khu vực mã QR để khách hàng nhìn thấy
        setTimeout(() => {
            document.getElementById("qrSection").scrollIntoView({ behavior: 'smooth' });
        }, 300);
    }

    // Khởi chạy ứng dụng lần đầu tiên
    renderProduct();
</script>

</body>
</html>

</body>
</html>
